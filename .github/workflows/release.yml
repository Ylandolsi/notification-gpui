name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "notchd-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory $name
          Copy-Item target/release/notchd.exe, README.md, assets/OFL-Rubik.txt $name
          Compress-Archive $name "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "$name.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            notchd-*.zip
            notchd-*.zip.sha256
