[package]
name = "notchd"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "notchd"
path = "src/main.rs"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
windows = { version = "0.61.3", features = [
    "ApplicationModel",
    "Foundation_Collections",
    "Management_Deployment",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6.2"
flume = "0.12"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
anyhow = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
